<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: #f4f4f4;
        margin: 0;
        padding: 0;
      }

      h6 {
        font-size: 24px;
        margin-top: 40px;
        color: #333;
        text-transform: uppercase;
        letter-spacing: 2px;
      }

      img {
        width: 300px;
        height: 200px;
        object-fit: cover;
        margin: 20px 0;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      }

      button {
        padding: 10px 20px;
        margin: 10px;
        border: none;
        background: #007bff;
        color: white;
        font-size: 16px;
        border-radius: 6px;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        background: #0056b3;
      }

      button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h6 id="slider"></h6>
      <img src="" id="img" alt="" />
      <div>
        <button id="back">Back</button>
        <button id="next">Next</button>
      </div>
    </div>
  </body>

  <script>
    let slider = document.getElementById("slider");
    let img = document.getElementById("img");
    let next = document.getElementById("next");
    let back = document.getElementById("back");

    let count = 0;

    let array = ["html", "css", "js", "react"];
    let image = [
      "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTU3HFVnkYFJ_OIogo__Qv58bmhwRqZJcQhOA&s",
      "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRXert6ekqTL1J7LVWNAhs65_GeostayFqh6A&s",
      "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTgrTLYPUyH-UieHupbuKkh1FKZ_rq1dX0gIw&s",
      "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQsel-0uvujE_QSaKBxJ8Gw8Yg7I0rYAdjzYg&s",
    ];

    function showData() {
      slider.innerText = array[count];
      img.src = image[count];
      buttonDisable();
    }

    function nextSlide() {
      count++;
      if (count > array.length - 1) {
        count = 0;
      }
      showData();
    }

    function prevSlide() {
      count--;
      if (count < 0) {
        count = array.length - 1;
      }
      showData();
    }

    next.addEventListener("click", () => {
      nextSlide();
      resetAutoSlide();
    });

    back.addEventListener("click", () => {
      prevSlide();
      resetAutoSlide();
    });

    function buttonDisable() {
      next.disabled = count == array.length - 1;
      back.disabled = count == 0;
    }

    // 🔥 AUTO SLIDER
    let autoSlide = setInterval(nextSlide, 2000); // 2 sec

    function resetAutoSlide() {
      clearInterval(autoSlide);
      autoSlide = setInterval(nextSlide, 2000);
    }

    showData();
  </script>
</html>
