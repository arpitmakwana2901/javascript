<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <div>
      <input type="text" id="inputText" />
      <button id="add">Add</button>
      <div id="container"></div>
    </div>
  </head>
  <body>
    <script>
      let inputText = document.getElementById("inputText");
      let add = document.getElementById("add");
      let container = document.getElementById("container");
      let array = JSON.parse(localStorage.getItem("todoData")) || [];
      let editIndex = -1;
      showData();
      add.addEventListener("click", () => {
        if (editIndex == -1) {
          array.push(inputText.value);
        } else {
          array[editIndex] = inputText.value;
          editIndex = -1;
          add.innerText = "Add";
        }
        console.log(inputText.value);
        localStorage.setItem("todoData", JSON.stringify(array));
        showData();
      });

      function showData() {
        container.innerHTML = "";
        array.forEach((element, index) => {
          let card = document.createElement("div");
          let paragraph = document.createElement("p");
          paragraph.innerText = element;

          let deleteBtn = document.createElement("button");
          deleteBtn.innerText = "Delete";

          let editBtn = document.createElement("button");
          editBtn.innerText = "Edit";

          deleteBtn.addEventListener("click", () => {
            array = array.filter((ele, i) => i != index);
            localStorage.setItem("todoData", JSON.stringify(array));

            showData();
          });

          editBtn.addEventListener("click", () => {
            inputText.value = element;
            editIndex = index;
            add.innerText = "Update";
          });

          card.append(paragraph, deleteBtn, editBtn);
          container.append(card);
        });
        inputText.value = "";
      }
    </script>
  </body>
</html>
